# Repository checks only: no deployment, GitHub App secrets, or PR publication.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
# Checkout needs read access; tests do not require write permissions.
permissions:
  contents: read
# A newer revision replaces outdated checks instead of wasting runner capacity.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # ci installs exactly the committed lockfile; generate does not need a DB.
      - run: npm ci
      - run: npm run db:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  data-services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      DATABASE_URL: postgresql://dogwatch:dogwatch_local_only@127.0.0.1:5433/dogwatch
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      # Use the same Compose definition as local development, rather than drift.
      - run: npm run infra:up
      - run: npm run db:migrate
      # Applying again must be a no-op, not an error or destructive schema reset.
      - run: npm run db:migrate
      - run: npm run db:status
      - run: npm run db:verify
      - run: npm run db:verify:acceptance
      - run: npm run queue:verify
      # Isolated random-tenant HTTP/DB readiness checks; no customer preview access.
      - run: npm run preview:verify
      # Build only the small trusted sandbox context, then verify real engine controls.
      - run: npm run sandbox:build
      - run: npm run isolation:verify
      - name: Verify Redis connectivity
        run: test "$(docker compose exec -T redis redis-cli ping)" = PONG
      # Capture failures while the services still exist, then stop without deleting volumes.
      - name: Service diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop services
        if: always()
        run: npm run infra:down
