# Disposable rehearsal only. Never merge into production infrastructure.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dogwatch
      POSTGRES_PASSWORD: ${RELEASE_DB_PASSWORD:?Generated by the rehearsal command}
      POSTGRES_DB: dogwatch_release
    ports:
      - '127.0.0.1::5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dogwatch -d dogwatch_release']
      interval: 1s
      timeout: 3s
      retries: 40
    mem_limit: 512m
    cpus: 1
  redis:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1::6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 3s
      retries: 40
    mem_limit: 256m
    cpus: 0.5
